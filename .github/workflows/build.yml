name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    env:
      CODE_SIGNING_ALLOWED: "NO"
      CODE_SIGNING_REQUIRED: "NO"
    steps:
      - uses: actions/checkout@v4

      - name: Show repo structure (debug)
        run: |
          echo "=== Repo root ==="
          ls -la
          echo "=== Swift sources ==="
          ls -la TeraBoxPlayer/ || echo "!!! TeraBoxPlayer folder MISSING !!!"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen

      - name: Build unsigned app (with full log)
        run: |
          set -o pipefail
          xcodebuild -project TeraBoxPlayer.xcodeproj -scheme TeraBoxPlayer \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee build-log.txt
          echo "---- ERRORS ----"
          grep -i "error:" build-log.txt || echo "no error lines found"

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build-log.txt

      - name: Package unsigned IPA
        run: |
          APP_PATH=$(find build/Build/Products/Release-iphoneos -name "*.app")
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r TeraBoxPlayer-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: TeraBoxPlayer-unsigned.ipa
          path: TeraBoxPlayer-unsigned.ipa
