name: TeraBoxPlayer
options:
  bundleIdPrefix: com.yourname        # ← change to anything unique
targets:
  TeraBoxPlayer:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources: [TeraBoxPlayer]
    info:
      path: TeraBoxPlayer/Info.plist  # auto-generated
      properties:
        CFBundleDisplayName: TeraBox Player
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIBackgroundModes: [audio]    # keep playing when screen locks
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true  # TeraBox CDNs use plain HTTP sometimes
