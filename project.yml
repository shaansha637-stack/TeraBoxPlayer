name: TeraBoxPlayer
options:
  bundleIdPrefix: com.myapp
targets:
  TeraBoxPlayer:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources: [TeraBoxPlayer]
    info:
      path: TeraBoxPlayer/Info.plist
      properties:
        CFBundleDisplayName: TeraBox Player
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
